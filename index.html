<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Dirty Dozen</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1a202c; --muted:#64748b; --line:#e2e8f0;
          --good:#15803d; --bad:#b91c1c; --accent:#1d4ed8; --pick:rgba(29,78,216,.10); }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f172a; --card:#1e293b; --ink:#e2e8f0; --muted:#94a3b8; --line:#334155;
            --good:#4ade80; --bad:#f87171; --accent:#60a5fa; --pick:rgba(96,165,250,.20); }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:20px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:1.6rem; } .sub { color:var(--muted); font-size:.9rem; }
  nav { display:flex; gap:8px; justify-content:center; padding:12px; flex-wrap:wrap;
        position:sticky; top:0; background:var(--bg); }
  nav button { border:1px solid var(--line); background:var(--card); color:var(--ink);
               padding:8px 14px; border-radius:20px; cursor:pointer; font-size:.9rem; }
  nav button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:1080px; margin:0 auto; padding:8px 12px 48px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:12px 14px; overflow-x:auto; }
  .card h2 { margin:0 0 2px; font-size:1.05rem; }
  .card .tn { color:var(--muted); font-size:.82rem; margin-bottom:8px; }
  table { border-collapse:collapse; width:100%; font-size:.85rem; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:3px 8px 3px 0; }
  td { padding:3px 8px 3px 0; border-top:1px solid var(--line); white-space:nowrap; }
  #keeperGrid th:nth-child(n+3), #keeperGrid td:nth-child(n+3) { text-align:center; }
  .ok { color:var(--good); font-weight:600; } .no { color:var(--bad); }
  .muted { color:var(--muted); } .status { text-align:center; padding:40px; color:var(--muted); }
  section { display:none; } section.active { display:block; }
  pre.rules { white-space:pre-wrap; font:inherit; }
  tr.sel { cursor:pointer; } tr.sel:hover td { background:var(--pick); }
  tr.picked td { background:var(--pick); }
  input.pick { accent-color:var(--accent); width:15px; height:15px; cursor:pointer;
               vertical-align:middle; }
  .slots { margin-top:8px; padding-top:6px; border-top:1px solid var(--line);
           font-size:.82rem; color:var(--muted); }
  .slots b { color:var(--ink); font-weight:600; }
  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
             align-items:center; justify-content:center; z-index:50; padding:16px; }
  #overlay.open { display:flex; }
  #playerCard { background:var(--card); border:1px solid var(--line); border-radius:12px;
                max-width:380px; width:100%; padding:16px 18px; position:relative;
                box-shadow:0 10px 40px rgba(0,0,0,.35); }
  #playerCard h3 { margin:0 0 2px; font-size:1.1rem; padding-right:24px; }
  #playerCard .close { position:absolute; top:8px; right:12px; border:0; background:none;
                       color:var(--muted); font-size:1.4rem; cursor:pointer; line-height:1; }
  .hist { margin-top:10px; border-top:1px solid var(--line); }
  .hist > div { padding:6px 0; border-bottom:1px solid var(--line); font-size:.88rem;
                display:flex; justify-content:space-between; gap:12px; }
  .hist .yr { color:var(--muted); white-space:nowrap; }
  .kbadge { display:inline-block; font-size:.72rem; padding:1px 6px; border-radius:8px;
            background:var(--pick); color:var(--accent); margin-left:6px; }
  .pc-note { margin-top:10px; font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>The Dirty Dozen</h1>
  <div class="sub" id="subtitle">loading…</div>
</header>
<nav>
  <button data-tab="keepers" class="active">Keepers</button>
  <button data-tab="weekly">Weekly $</button>
  <button data-tab="standings">Standings</button>
  <button data-tab="rules">Rules</button>
</nav>
<main>
  <div class="status" id="status">Fetching live data from Sleeper…</div>
  <section id="keepers" class="active">
    <div class="grid" id="keeperGrid"></div>
    <div class="muted" style="margin-top:8px">Tap a player for their recent draft history. Check up to 3 Keep boxes on a team to preview final keeper slots (collisions and traded picks resolved).</div>
  </section>
  <section id="weekly"><div class="card" id="weeklyCard"></div></section>
  <section id="standings"><div class="card" id="standingsCard"></div></section>
  <section id="rules"><div class="card"><pre class="rules" id="rulesText"></pre></div></section>
</main>
<div id="overlay">
  <div id="playerCard" role="dialog" aria-modal="true">
    <button class="close" id="pcClose" aria-label="Close">&times;</button>
    <div id="pcBody"></div>
  </div>
</div>
<script type="module">
import { computeKeeperBoard, resolveKeeperSlots } from './lib/keepers.js';
import { weeklyWinner } from './lib/finances.js';

const LEAGUE_ID = '1389387813203484672';
const API = 'https://api.sleeper.app/v1';
const $ = (id) => document.getElementById(id);
const j = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); };

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section').forEach(s =>
    s.classList.toggle('active', s.id === b.dataset.tab));
});

async function playerNames(neededIds) {
  const KEY = 'dd_players_v1';
  try {
    const c = JSON.parse(localStorage.getItem(KEY));
    if (c && Date.now() - c.ts < 86400e3 && neededIds.every(id => c.map[id])) return c.map;
  } catch {}
  const all = await j(`${API}/players/nfl`);   // ~5 MB, then trimmed + cached
  const map = {};
  for (const id of neededIds) {
    const p = all[id];
    map[id] = p ? { name: `${p.first_name} ${p.last_name}`, position: p.position ?? '' }
                : { name: id, position: '' };
  }
  try { localStorage.setItem(KEY, JSON.stringify({ ts: Date.now(), map })); } catch {}
  return map;
}

async function load() {
  // Committed at the repo root, so it is same-origin on Pages and served locally too.
  // Null (missing/unparseable) degrades to no overrides + a generic payout line.
  const config = await j('./config.json').catch(() => null);
  const chain = [];
  let id = LEAGUE_ID;
  while (id && id !== '0') { const lg = await j(`${API}/league/${id}`); chain.push(lg); id = lg.previous_league_id; }
  const current = chain[0];
  $('subtitle').textContent = `${current.season} season — live from Sleeper`;
  const [users, rosters] = await Promise.all([
    j(`${API}/league/${current.league_id}/users`),
    j(`${API}/league/${current.league_id}/rosters`),
  ]);
  const seasons = [];
  await Promise.all(chain.map(async lg => {
    const drafts = await j(`${API}/league/${lg.league_id}/drafts`);
    if (!drafts[0]) return;
    if (Number(lg.season) < Number(current.season)) {
      seasons.push({ year: Number(lg.season),
                     picks: await j(`${API}/draft/${drafts[0].draft_id}/picks`) });
    }
  }));
  const tradedPicks = await j(`${API}/league/${current.league_id}/traded_picks`);
  const ids = rosters.flatMap(r => r.players ?? []);
  const names = await playerNames(ids);
  const board = computeKeeperBoard({
    seasons, rosters, users, tradedPicks,
    upcomingSeason: current.season, rounds: 15, playerNames: names,
    overrides: config?.basisOverrides ?? {},
  });
  histCache = buildHistCache(seasons, users, rosters);
  chainCache = chain;
  preDraftCurrent = current.status === 'pre_draft';
  renderKeepers(board);
  await renderWeekly(current, users, rosters, config);
  renderStandings(users, rosters);
  $('rulesText').textContent = rulesText(config?.amounts);
  $('status').style.display = 'none';
}

// What-if keeper picker state: team index -> Set of chosen playerIds (max 3).
const MAX_KEEPERS = 3;
const picked = new Map();
let boardCache = null;
let histCache = null;
let chainCache = null;
let preDraftCurrent = false;
let txnEventsPromise = null;
let currentCardPid = null;

// Owner names are looked up through the CURRENT rosters — roster_id -> owner has
// been stable in this league since 2021, so historical picks resolve correctly.
function buildHistCache(seasons, users, rosters) {
  const userById = new Map(users.map(u => [u.user_id, u]));
  const ownerByRoster = new Map(rosters.map(r =>
    [r.roster_id, userById.get(r.owner_id)?.display_name ?? `roster ${r.roster_id}`]));
  const yearsDesc = [...seasons].sort((a, b) => b.year - a.year).slice(0, 3);
  return { yearsDesc, ownerByRoster };
}

function renderKeepers(board) {
  boardCache = board;
  picked.clear();
  $('keeperGrid').innerHTML = board.teams.map((t, ti) => `
    <div class="card">
      <h2>${esc(t.teamName || t.ownerName)}</h2>
      <div class="tn">@${esc(t.ownerName)}</div>
      <table>
        <tr><th>Player</th><th>Pos</th><th>Drafted</th><th>Keeper cost</th><th>Yrs kept</th><th>Keep</th></tr>
        ${t.players.map(p => `
          <tr class="sel" data-team="${ti}" data-player="${esc(p.playerId)}">
            <td>${esc(p.name)}</td><td class="muted">${esc(p.position)}</td>
            <td>${p.basisRound === 'FA' ? '<span class="muted">FA</span>' : `R${p.basisRound}`}</td>
            <td>${p.eligible ? `<span class="ok">R${p.costRound}</span>`
                             : `<span class="no" title="${esc(p.reason ?? '')}">N/A</span>`}</td>
            <td class="muted">${p.yearsKept || ''}</td>
            <td>${p.eligible ? `<input type="checkbox" class="pick" data-team="${ti}"
                  data-player="${esc(p.playerId)}" aria-label="Select ${esc(p.name)} as keeper">` : ''}</td>
          </tr>`).join('')}
      </table>
      <div class="slots" id="slots-${ti}" hidden></div>
    </div>`).join('');
}

// Checkbox = what-if keeper selection (delegated; survives re-renders).
$('keeperGrid').addEventListener('change', (e) => {
  const cb = e.target.closest('input.pick');
  if (!cb) return;
  const ti = Number(cb.dataset.team);
  const pid = cb.dataset.player;
  const set = picked.get(ti) ?? new Set();
  if (cb.checked) {
    if (set.size >= MAX_KEEPERS) { cb.checked = false; return; }  // at the cap
    set.add(pid);
  } else {
    set.delete(pid);
  }
  picked.set(ti, set);
  cb.closest('tr').classList.toggle('picked', cb.checked);
  renderSlots(ti);
});

// Row tap = player history sub-card (the Keep column is reserved for the checkbox).
$('keeperGrid').addEventListener('click', (e) => {
  if (e.target.closest('td:last-child')) return;   // checkbox cell: never open the card
  const tr = e.target.closest('tr[data-player]');
  if (!tr) return;
  openPlayerCard(Number(tr.dataset.team), tr.dataset.player);
});

// --- Player movement history (trades / waivers / FA moves) -----------------
// Fetched lazily on the first sub-card open: every completed transaction for
// the seasons in the 3-draft history window (+ the current offseason league),
// trimmed to rostered players and cached in localStorage for an hour.
const TXN_KEY = 'dd_txns_v1';

function ensureTransactions() {
  if (txnEventsPromise) return txnEventsPromise;
  txnEventsPromise = (async () => {
    try {
      const c = JSON.parse(localStorage.getItem(TXN_KEY));
      if (c && Date.now() - c.ts < 3600e3) return c.events;
    } catch {}
    const currentYear = Number(chainCache[0].season);
    const leagues = chainCache.filter(lg => Number(lg.season) >= currentYear - 3);
    const rostered = new Set(boardCache.teams.flatMap(t => t.players.map(p => p.playerId)));
    const events = {};   // player_id -> [{y, w, kind, from?, to?}]
    await Promise.all(leagues.flatMap(lg =>
      Array.from({ length: 18 }, (_, i) =>
        j(`${API}/league/${lg.league_id}/transactions/${i + 1}`).catch(() => [])
          .then(txns => {
            for (const t of txns ?? []) {
              if (t.status !== 'complete') continue;
              const y = Number(lg.season);
              const w = t.leg ?? (i + 1);
              const handled = new Set();
              for (const [pid, rid] of Object.entries(t.adds ?? {})) {
                if (!rostered.has(pid)) continue;
                handled.add(pid);
                const from = t.drops ? t.drops[pid] : undefined;
                (events[pid] ??= []).push(
                  t.type === 'trade'
                    ? { y, w, kind: 'trade', from, to: rid }
                    : { y, w, kind: t.type === 'waiver' ? 'claim' : 'fa', to: rid });
              }
              for (const [pid, rid] of Object.entries(t.drops ?? {})) {
                if (!rostered.has(pid) || handled.has(pid)) continue;
                (events[pid] ??= []).push(
                  t.type === 'trade'
                    ? { y, w, kind: 'trade', from: rid }
                    : { y, w, kind: 'drop', from: rid });
              }
            }
          }))));
    try { localStorage.setItem(TXN_KEY, JSON.stringify({ ts: Date.now(), events })); } catch {}
    return events;
  })();
  return txnEventsPromise;
}

function moveLabel(ev, owner) {
  if (ev.kind === 'trade') {
    if (ev.from != null && ev.to != null) return `traded @${owner(ev.from)} → @${owner(ev.to)}`;
    if (ev.to != null) return `acquired by trade → @${owner(ev.to)}`;
    return `traded away by @${owner(ev.from)}`;
  }
  if (ev.kind === 'claim') return `claimed off waivers by @${owner(ev.to)}`;
  if (ev.kind === 'fa') return `added as FA by @${owner(ev.to)}`;
  return `dropped by @${owner(ev.from)}`;
}

// Drafts (week 0) and movement events interleave into one reverse-chronological
// timeline. Capped so a churned bench player can't produce an endless card.
function histRows(pid, events) {
  const owner = (rid) => histCache.ownerByRoster.get(rid) ?? `roster ${rid}`;
  const rows = [];
  for (const { year, picks } of histCache.yearsDesc) {
    const pk = picks.find(x => x.player_id === pid);
    rows.push({ y: year, w: 0, html: pk
      ? `<div><span class="yr">${year} draft</span><span>R${pk.round} &middot; @${esc(owner(pk.roster_id))}${pk.is_keeper ? '<span class="kbadge">keeper slot</span>' : ''}</span></div>`
      : `<div><span class="yr">${year} draft</span><span class="muted">not drafted</span></div>` });
  }
  for (const ev of events ?? []) {
    const when = (preDraftCurrent && ev.y === Number(boardCache.upcomingSeason))
      ? `${ev.y} offseason` : `${ev.y} wk ${ev.w}`;
    rows.push({ y: ev.y, w: ev.w + 0.5,
      html: `<div><span class="yr">${when}</span><span>${esc(moveLabel(ev, owner))}</span></div>` });
  }
  rows.sort((a, b) => (b.y - a.y) || (b.w - a.w));
  const capped = rows.slice(0, 10);
  const more = rows.length > capped.length
    ? `<div><span class="yr"></span><span class="muted">+${rows.length - capped.length} earlier entries</span></div>` : '';
  return capped.map(r => r.html).join('') + more;
}

function openPlayerCard(ti, pid) {
  const team = boardCache?.teams[ti];
  const p = team?.players.find(x => x.playerId === pid);
  if (!p || !histCache) return;
  currentCardPid = pid;
  const yrs = p.yearsKept ? ` &middot; kept ${p.yearsKept} straight season${p.yearsKept > 1 ? 's' : ''}` : '';
  const keeper = p.eligible
    ? `<div class="pc-note">${esc(boardCache.upcomingSeason)} keeper cost: <span class="ok">R${p.costRound}</span>${yrs}</div>`
    : `<div class="pc-note"><span class="no">Not keeper-eligible</span> — ${esc(p.reason ?? '')}</div>`;
  const render = (events, note) => {
    $('pcBody').innerHTML = `
      <h3>${esc(p.name)}</h3>
      <div class="muted">${esc(p.position)} &middot; ${esc(team.teamName || team.ownerName)} (@${esc(team.ownerName)})</div>
      <div class="hist">${histRows(pid, events)}</div>${note}${keeper}`;
  };
  render(null, '<div class="pc-note muted">Loading trades &amp; waiver moves…</div>');
  $('overlay').classList.add('open');
  ensureTransactions().then(all => {
    if (currentCardPid !== pid || !$('overlay').classList.contains('open')) return;
    const evs = all[pid] ?? [];
    let note = '';
    if (!evs.length) {
      let lastPick = null, lastYear = null;
      for (const s of histCache.yearsDesc) {
        const pk = s.picks.find(x => x.player_id === pid);
        if (pk) { lastPick = pk; lastYear = s.year; break; }
      }
      if (lastPick && lastPick.roster_id !== team.rosterId) {
        note = `<div class="pc-note muted">Changed teams since the ${lastYear} draft (no logged move in the last 3 seasons).</div>`;
      }
    }
    render(evs, note);
  }).catch(() => {
    if (currentCardPid !== pid || !$('overlay').classList.contains('open')) return;
    render(null, '<div class="pc-note muted">Movement history unavailable right now.</div>');
  });
}

$('pcClose').addEventListener('click', () => $('overlay').classList.remove('open'));
$('overlay').addEventListener('click', (e) => {
  if (e.target === $('overlay')) $('overlay').classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') $('overlay').classList.remove('open');
});

function renderSlots(ti) {
  const el = $(`slots-${ti}`);
  const team = boardCache.teams[ti];
  const chosenIds = picked.get(ti) ?? new Set();
  if (!chosenIds.size) { el.hidden = true; el.innerHTML = ''; return; }
  const chosen = team.players.filter(p => p.eligible && chosenIds.has(p.playerId));
  el.hidden = false;
  el.innerHTML = 'Slots: ' + resolveKeeperSlots(chosen, team.ownedRounds).map(s => {
    const dir = !s.moved ? ''
      : (s.assignedRound < s.costRound ? ' (slid up)' : ' (pushed down)');
    return `<b>${esc(s.name)}</b> → R${s.assignedRound}${dir}`;
  }).join('<br>');
}

async function renderWeekly(current, users, rosters, config) {
  const userById = new Map(users.map(u => [u.user_id, u]));
  const ownerOf = new Map(rosters.map(r => [r.roster_id,
    userById.get(r.owner_id)?.display_name ?? `roster ${r.roster_id}`]));
  const lastWeek = (current.settings?.playoff_week_start ?? 15) - 1;
  const weeks = await Promise.all(Array.from({ length: lastWeek }, (_, i) =>
    j(`${API}/league/${current.league_id}/matchups/${i + 1}`).catch(() => [])));
  const tally = new Map();
  const rows = weeks.map((ms, i) => {
    const win = weeklyWinner(ms);
    const who = win ? win.rosterIds.map(rid => ownerOf.get(rid)) : [];
    if (win) who.forEach(w => tally.set(w, (tally.get(w) ?? 0) + 1));
    return `<tr><td>Week ${i + 1}</td><td>${win ? esc(who.join(' / ')) : '<span class="muted">—</span>'}</td>
            <td class="muted">${win ? win.points.toFixed(2) : ''}</td></tr>`;
  }).join('');
  const weeklyAmt = config?.amounts?.weeklyPoints ?? 10;
  const tallyRows = [...tally.entries()].sort((a, b) => b[1] - a[1])
    .map(([n, c]) => `<tr><td>${esc(n)}</td><td>${c}</td><td>$${c * weeklyAmt}</td></tr>`).join('');
  $('weeklyCard').innerHTML = `
    <h2>Weekly high scores</h2>
    <table><tr><th>Week</th><th>Winner</th><th>Points</th></tr>${rows}</table>
    ${tallyRows ? `<h2 style="margin-top:16px">Wins tally</h2>
    <table><tr><th>Owner</th><th>Weeks won</th><th>$</th></tr>${tallyRows}</table>` : ''}`;
}

function renderStandings(users, rosters) {
  const userById = new Map(users.map(u => [u.user_id, u]));
  const sorted = [...rosters].sort((a, b) =>
    (b.settings?.wins ?? 0) - (a.settings?.wins ?? 0) ||
    (b.settings?.fpts ?? 0) - (a.settings?.fpts ?? 0));
  $('standingsCard').innerHTML = `<h2>Standings</h2>
    <table><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>PF</th></tr>
    ${sorted.map((r, i) => {
      const u = userById.get(r.owner_id);
      return `<tr><td>${i + 1}</td><td>${esc(u?.metadata?.team_name || u?.display_name || '?')}</td>
        <td>${r.settings?.wins ?? 0}</td><td>${r.settings?.losses ?? 0}</td>
        <td class="muted">${((r.settings?.fpts ?? 0)
          + (r.settings?.fpts_decimal ?? 0) / 100).toFixed(2)}</td></tr>`;
    }).join('')}</table>`;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const RULES_BODY = `Dirty Dozen Keeper Rules

- 3 keepers max. You are not required to keep any players.
- No player drafted in the first or second round may be kept the next year.
- You may only keep a player for 3 consecutive seasons (per team - the clock
  restarts if a kept player changes teams).

Keeper cost (from the round taken the previous year):
- 1st year kept: previous round - 1
- 2nd year kept: previous round - 4
- 3rd year kept: previous round - 8
- Waiver pickups never drafted that season: round 10, then 6, then 1.
- If the cost would be round 0 or less, the player takes the team's 1st round pick
  and pushes other picks downstream as necessary.
- If you trade the draft pick a keeper would occupy, the player moves up to the
  next available round. Two keepers in the same round: one takes the next highest
  available round (both still count at their nominal round going forward).

Draft order is chosen by managers in reverse order of last season's standings.`;

// Only the payout line is data-driven; the rest of the rules are static text.
function rulesText(amounts) {
  const places = amounts?.places ?? [];
  const payout = amounts && places.length >= 3
    ? `Payouts: $${amounts.dues}/player. 1st $${places[0]}, 2nd $${places[1]}, ` +
      `3rd $${places[2]}, weekly high score $${amounts.weeklyPoints}.`
    : 'Payouts: see league settings.';
  return `${RULES_BODY}\n\n${payout}`;
}

load().catch(err => { $('status').textContent = `Failed to load: ${err.message}`; });
</script>
</body>
</html>
